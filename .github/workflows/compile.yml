name: Java compile check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          ls "$ANDROID_HOME/platforms" || true

      - name: Compile Java sources (syntax check)
        run: |
          SDK="$ANDROID_HOME"
          JAR=$(ls "$SDK"/platforms/android-*/android.jar | sort -V | tail -1)
          echo "Using $JAR"
          mkdir -p /tmp/out
          find ocstandalone/src ocstandalone -name '*.java' -print0 | xargs -0 javac -cp "$JAR" -d /tmp/out 2>&1 | head -40
          echo "Compile step finished."
